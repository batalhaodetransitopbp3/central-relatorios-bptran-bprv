<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão P3 — BPTran/BPRv</title><style>
:root{--b:#17375e;--b2:#2e6696;--bg:#edf3f7;--line:#c9d6e0;--ok:#176b3a;--warn:#8a5b00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial;color:#19334b}.head{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;padding:16px}.head h1{margin:0;font-size:22px}.wrap{max-width:1400px;margin:auto;padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px;box-shadow:0 2px 8px #1231}.filters{display:grid;grid-template-columns:1fr 1fr 1.2fr 1.2fr auto;gap:8px;align-items:end}label{display:block;font-size:10px;font-weight:800;color:#536b7d;margin-bottom:4px}input,select{width:100%;min-height:38px;border:1px solid #becdd8;border-radius:8px;padding:7px;background:#fff}button,.btn{border:0;border-radius:8px;background:var(--b2);color:#fff;padding:9px 12px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.secondary{background:#e7eef4;color:#17375e;border:1px solid #c2d0db}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button.active{background:var(--b)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:25px;color:var(--b)}.tablewrap{overflow:auto;max-height:65vh}.tbl{width:100%;border-collapse:collapse;min-width:1000px}.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid #d9e2e9;text-align:left;vertical-align:top}.tbl th{position:sticky;top:0;background:#f3f7f9;z-index:1;font-size:10px;color:#516a7f}.pill{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:800;background:#edf2f6}.ok{background:#e7f4ea;color:#176b3a}.warn{background:#fff3d5;color:#7d5600}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.empty{text-align:center;padding:25px;color:#6b7f90}.note{font-size:11px;color:#64798b}.oploc{font-weight:800}.coords{font-family:monospace;font-size:11px}.view.hidden{display:none}.chart{display:grid;gap:7px;margin:12px 0}.barrow{display:grid;grid-template-columns:minmax(110px,220px) 1fr 80px;gap:8px;align-items:center}.bartrack{height:20px;background:#edf2f6;border-radius:6px;overflow:hidden}.barfill{height:100%;background:linear-gradient(90deg,var(--b2),var(--b));border-radius:6px}.analysisctl{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.analysisctl>div{min-width:220px;flex:1}.delta{font-weight:800}.delta.pos{color:#176b3a}.delta.neg{color:#9a2b3e}
@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.filters>div:nth-child(3),.filters>div:nth-child(4){grid-column:span 1}.filters button{grid-column:1/-1}.stats{grid-template-columns:1fr 1fr}.tabs button{flex:1 1 45%}}
</style></head><body>
<header class="head"><h1>Gestão P3 — Controle e Produtividade Operacional</h1><div>BPTran / BPRv • conferência, operações, estatística e auditoria</div></header>
<main class="wrap">
<section class="card"><div class="filters">
<div><label>Data inicial</label><input id="di" type="date"></div><div><label>Data final</label><input id="df" type="date"></div>
<div><label>Batalhão</label><select id="bat"><option value="">Todos</option><option>BPTran</option><option>BPRv</option></select></div>
<div><label>Companhia</label><select id="cia"><option value="">Todas</option></select></div><button id="apply">Aplicar filtros</button></div>
<div class="toolbar"><a class="btn secondary" href="index.html">Central</a><a class="btn secondary" href="cadastros_admin.html">Cadastros</a><a class="btn secondary" href="motomecanizacao.html">Motomecanização</a><button class="secondary" id="biBtn">Power BI</button></div></section>
<section class="card"><div class="tabs"><button data-view="controle-diario" class="active">Controle diário</button><button data-view="produtividade">Produtividade</button><button data-view="analise">Análise estatística</button><button data-view="operacoes">Operações</button><button data-view="prisoes">Prisões/Conduções</button><button data-view="cirvc">CIRVC</button><button data-view="auditoria">Auditoria</button></div></section>
<div id="stats" class="stats"></div>
<section class="card view" id="mainView"><div id="title"></div><div class="tablewrap"><table class="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section>
</main>
<script src="central_cloud.js"></script><script>
(function(){
 const $=id=>document.getElementById(id),cias=['1ª CPTran','2ª CPTran','3ª CPTran','4ª CPTran','5ª CPTran','1ª CPRv','2ª CPRv','3ª CPRv','4ª CPRv','5ª CPRv'];let view='controle-diario',last=null,analysisIndicator='';
 $('cia').innerHTML='<option value="">Todas</option>'+cias.map(x=>'<option>'+x+'</option>').join('');
 const today=new Date().toISOString().slice(0,10);$('di').value=today;$('df').value=today;
 function t(){return CentralCloud.askToken('p3')}
 async function ensure(){if(!await CentralCloud.probe())throw new Error('Backend v10 ainda não publicado.');const x=t();if(!x)throw new Error('Informe a Chave P3.');return x}
 function params(token){return {token,view,dataInicio:$('di').value,dataFim:$('df').value,batalhao:$('bat').value,companhia:$('cia').value}}
 async function load(){try{const token=await ensure();if(view==='analise'){await loadAnalysis(token);return}const r=await CentralCloud.jsonp('p3-query',params(token));last=r;render(r)}catch(e){$('tbody').innerHTML='<tr><td class="empty">'+esc(e.message)+'</td></tr>'}}
 async function loadAnalysis(token){
   const base={token,batalhao:$('bat').value,companhia:$('cia').value,dataInicio:$('di').value,dataFim:$('df').value,indicador:analysisIndicator};
   let r=await CentralCloud.jsonp('p3-analysis',base);if(!analysisIndicator&&r.indicadores?.length){analysisIndicator=r.indicadores[0];r=await CentralCloud.jsonp('p3-analysis',{...base,indicador:analysisIndicator})}
   const a=new Date($('di').value+'T12:00:00'),b=new Date($('df').value+'T12:00:00'),days=Math.max(1,Math.round((b-a)/86400000)+1),prevEnd=new Date(a.getTime()-86400000),prevStart=new Date(prevEnd.getTime()-(days-1)*86400000);
   const iso=d=>d.toISOString().slice(0,10),pr=await CentralCloud.jsonp('p3-analysis',{...base,indicador:analysisIndicator,dataInicio:iso(prevStart),dataFim:iso(prevEnd)});
   renderAnalysis(r,pr,iso(prevStart),iso(prevEnd));
 }
 function columnsFor(v){
  if(v==='produtividade')return [['DATA_SERVICO','Data'],['BATALHAO','Batalhão'],['COMPANHIA','Companhia'],['GUARNICAO','Guarnição'],['GRUPO_NOME','Grupo'],['INDICADOR_NOME','Indicador'],['QUANTIDADE','Qtd.'],['ORIGEM_RELATORIO','Origem']];
  if(v==='operacoes')return [['DATA','Data'],['COMPANHIA','Companhia'],['GUARNICAO_RESPONSAVEL','Guarnição'],['OPERACAO','Operação'],['TURNO','Turno'],['POD_STATUS','Cumprimento POD'],['LOCAL_PREVISTO','Local previsto'],['LOCAL_EXECUTADO','Local executado'],['COORDENADAS_EXECUTADAS','Coordenadas reais'],['PESSOAS_ABORDADAS','Pessoas'],['MOTOCICLETAS_ABORDADAS','Motos'],['ART_165','165'],['ART_165_A','165-A'],['AITS_SEM_ABORDAGEM','AIT s/abord.'],['PRISOES','Prisões'],['STATUS_REGISTRO','Status']];
  if(v==='prisoes')return [['DATA','Data'],['COMPANHIA','Companhia'],['GUARNICAO','Guarnição'],['SITUACAO','Situação'],['TIPIFICACAO_PRINCIPAL','Tipificação principal'],['TIPIFICACOES_RELACIONADAS','Relacionadas'],['QUANTIDADE','Qtd.'],['OCORRENCIA_ID','Ocorrência'],['ORIGEM_RELATORIO','Origem']];
  if(v==='cirvc')return [['DATA_CADASTRO','Cadastro'],['COMPANHIA','Companhia'],['GUARNICAO','Guarnição'],['PLACA','Placa'],['TIPO','Tipo'],['MARCA_MODELO','Marca/modelo'],['LOCAL_CUSTODIA','Custódia'],['STATUS_CUSTODIA','Status'],['DESTINO_FINAL','Destino'],['BAIXADO_EM','Baixado em']];
  if(v==='auditoria')return [['DATA_HORA','Data/hora'],['TIPO_ENTIDADE','Entidade'],['ENTIDADE_ID','ID'],['VERSAO','Versão'],['ACAO','Ação'],['RESPONSAVEL_MATRICULA','Matrícula'],['RESPONSAVEL_NOME','Responsável'],['COMPANHIA','Companhia'],['ORIGEM','Origem']];
  return [];
 }
 function render(r){
  if(view==='controle-diario') return renderControl(r);
  const items=r.items||[],cols=columnsFor(view);$('title').innerHTML='<h2>'+({produtividade:'Produtividade operacional',operacoes:'Operações individualizadas',prisoes:'Prisões e conduções por tipificação',cirvc:'CIRVC — custódia',auditoria:'Auditoria e versões'}[view]||view)+'</h2>';
  $('thead').innerHTML='<tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr>';
  $('tbody').innerHTML=items.length?items.map(x=>'<tr>'+cols.map(c=>'<td>'+formatCell(c[0],x[c[0]],x)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+cols.length+'" class="empty">Nenhum registro para os filtros.</td></tr>';
  if(view==='operacoes')renderOpStats(items);else if(view==='produtividade')renderProdStats(items);else if(view==='prisoes')renderPrisonStats(items);else $('stats').innerHTML='';
 }
 function renderAnalysis(r,prev,pdi,pdf){
  $('title').innerHTML='<h2>Análise estatística</h2><div class="analysisctl"><div><label>Indicador</label><select id="analysisIndicator">'+(r.indicadores||[]).map(x=>'<option '+(x===analysisIndicator?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div><div class="note">Comparação automática com período anterior equivalente: '+esc(pdi)+' a '+esc(pdf)+'</div></div><div id="analysisChart" class="chart"></div>';
  $('thead').innerHTML='';$('tbody').innerHTML='';
  const cur=Number(r.total||0),old=Number(prev.total||0),pct=old?((cur-old)/old*100):null;
  $('stats').innerHTML=cards([['Total atual',cur],['Período anterior',old],['Variação',pct===null?'—':((pct>=0?'+':'')+pct.toFixed(1)+'%')],['Companhias',(r.porCompanhia||[]).length],['Dias com registro',(r.porData||[]).length]]);
  const max=Math.max(1,...(r.porCompanhia||[]).map(x=>Number(x.valor||0)));
  $('analysisChart').innerHTML=(r.porCompanhia||[]).length?(r.porCompanhia||[]).map(x=>'<div class="barrow"><strong>'+esc(x.nome)+'</strong><div class="bartrack"><div class="barfill" style="width:'+Math.max(1,Number(x.valor||0)/max*100)+'%"></div></div><span>'+esc(x.valor)+'</span></div>').join(''):'<div class="empty">Sem dados para este indicador/período.</div>';
  document.getElementById('analysisIndicator')?.addEventListener('change',e=>{analysisIndicator=e.target.value;load()});
 }
 function renderControl(r){
  const rsd=r.rsd||[],rco=r.rco||[];$('title').innerHTML='<h2>Controle diário</h2><div class="note">RSDs finalizados ficam disponíveis ao RCO sem troca de arquivos.</div>';
  const cols=[['DATA_SERVICO','Data'],['BATALHAO','Batalhão'],['COMPANHIA','Companhia'],['GUARNICAO','Guarnição'],['STATUS','Status'],['RESPONSAVEL_NOME','Responsável'],['VERSAO','Versão'],['RCO_REPORT_ID','RCO']];
  $('thead').innerHTML='<tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr>';
  $('tbody').innerHTML=rsd.length?rsd.map(x=>'<tr>'+cols.map(c=>'<td>'+formatCell(c[0],x[c[0]],x)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="8" class="empty">Nenhum RSD localizado.</td></tr>';
  const fin=rsd.filter(x=>x.STATUS==='FINALIZADO').length,inc=rsd.filter(x=>x.STATUS==='INCLUIDO_RCO').length,ret=rsd.filter(x=>Number(x.VERSAO||1)>1).length;
  $('stats').innerHTML=cards([['RSDs',rsd.length],['Finalizados',fin],['Incluídos no RCO',inc],['Retificados',ret],['RCOs',rco.length]]);
 }
 function renderOpStats(items){
  const types=new Set(items.map(x=>x.OPERACAO).filter(Boolean)),actual=items.filter(x=>x.LOCAL||x.LATITUDE).length,zero=items.filter(x=>/zero.?álcool/i.test(x.OPERACAO||'')).length,rand=items.filter(x=>/randandan/i.test(x.OPERACAO||'')).length;
  $('stats').innerHTML=cards([['Operações',items.length],['Tipos',types.size],['Com local executado',actual],['Zero Álcool',zero],['Randandan',rand]]);
 }
 function renderPrisonStats(items){const total=items.reduce((a,x)=>a+(Number(x.QUANTIDADE)||0),0),fl=items.filter(x=>x.SITUACAO==='FLAGRANTE').reduce((a,x)=>a+(Number(x.QUANTIDADE)||0),0),mp=items.filter(x=>x.SITUACAO==='CUMPRIMENTO_MANDADO').reduce((a,x)=>a+(Number(x.QUANTIDADE)||0),0),ad=items.filter(x=>x.SITUACAO==='APREENSAO_ADOLESCENTE').reduce((a,x)=>a+(Number(x.QUANTIDADE)||0),0);$('stats').innerHTML=cards([['Registros',items.length],['Pessoas',total],['Flagrantes',fl],['Mandados',mp],['Adolescentes',ad]])}
 function renderProdStats(items){const total=items.reduce((a,x)=>a+(Number(x.QUANTIDADE)||0),0);$('stats').innerHTML=cards([['Registros',items.length],['Somatório exibido',total],['Companhias',new Set(items.map(x=>x.COMPANHIA)).size],['Guarnições',new Set(items.map(x=>x.GUARNICAO)).size],['Indicadores',new Set(items.map(x=>x.INDICADOR_NOME)).size]])}
 function cards(a){return a.map(x=>'<div class="stat"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>').join('')}
 function formatCell(k,v,x){if(k==='STATUS'||k==='STATUS_CUSTODIA'||k==='STATUS_REGISTRO')return '<span class="pill '+(/FINAL|INCLUID|CONSOLID|BAIXADO/.test(v||'')?'ok':'warn')+'">'+esc(v||'—')+'</span>';if((k==='LOCAL'||k==='LOCAL_EXECUTADO')&&v)return '<span class="oploc">'+esc(v)+'</span>';if(k==='LATITUDE'||k==='LONGITUDE'||k==='COORDENADAS_EXECUTADAS')return '<span class="coords">'+esc(v||'')+'</span>';if(k==='POD_STATUS')return '<span class="pill '+(/conforme/i.test(v||'')?'ok':'warn')+'">'+esc(v||'—')+'</span>';return esc(v??'')}
 function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;load()});
 $('apply').onclick=load;$('bat').onchange=()=>{const b=$('bat').value;$('cia').querySelectorAll('option').forEach((o,i)=>{if(!o.value)return;o.hidden=b==='BPTran'?!/CPTran/.test(o.value):b==='BPRv'?!/CPRv/.test(o.value):false});};
 $('biBtn').onclick=()=>{let url=localStorage.getItem('pmpb-powerbi-url')||'';if(!url){url=prompt('Cole a URL do painel Power BI publicado para a Gestão P3. Ela ficará salva apenas neste aparelho:')||'';if(url)localStorage.setItem('pmpb-powerbi-url',url)}if(url)window.open(url,'_blank','noopener')};
 setTimeout(load,450);
})();
</script></body></html>
