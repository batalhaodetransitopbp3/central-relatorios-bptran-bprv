<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadastros — Central de Relatórios</title><style>
:root{--b:#17375e;--b2:#2e6696;--bg:#edf3f7;--line:#c9d6e0}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial;color:#19334b}.head{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;padding:16px}.head h1{margin:0;font-size:21px}.wrap{max-width:1100px;margin:auto;padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{border:0;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer;background:#e6edf3;color:#17375e}.tabs button.active{background:var(--b2);color:#fff}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:8px}.f{grid-column:span 4}.f.w6{grid-column:span 6}.f.w12{grid-column:1/-1}label{display:block;font-size:11px;font-weight:800;color:#566d7f;margin-bottom:4px}input,select{width:100%;min-height:39px;border:1px solid #bdccd8;border-radius:8px;padding:7px}button,.btn{border:0;border-radius:8px;background:var(--b2);color:#fff;padding:9px 12px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center}.secondary{background:#e6eef4;color:#17375e;border:1px solid #c3d0db}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.results{display:grid;gap:6px}.result{border:1px solid #d5dfe7;border-radius:9px;padding:9px}.result strong{color:#17375e}.small{font-size:11px;color:#64798b}.hidden{display:none}@media(max-width:700px){.f,.f.w6{grid-column:1/-1}.actions button,.actions .btn{flex:1 1 45%}}
</style></head><body><header class="head"><h1>Cadastros da Central</h1><div>Efetivo e viaturas • rastreabilidade institucional</div></header>
<main class="wrap">
<section class="card"><div class="tabs"><button id="tabM" class="active">Militares</button><button id="tabV">Viaturas</button></div><div class="actions"><a class="btn secondary" href="gestao_p3.html">Voltar à Gestão P3</a></div></section>
<section id="mil" class="card"><h2>Cadastro mestre de militares</h2><div class="grid">
<div class="f"><label>Matrícula</label><input id="mMat" placeholder="000.000-0" inputmode="numeric"></div><div class="f"><label>Posto/graduação</label><input id="mPg"></div><div class="f"><label>Nome</label><input id="mNome"></div>
<div class="f"><label>Batalhão</label><select id="mBat"><option>BPTran</option><option>BPRv</option></select></div><div class="f"><label>Companhia</label><select id="mCia"></select></div><div class="f"><label>Situação</label><select id="mSit"><option>ATIVO</option><option>INATIVO</option><option>TRANSFERIDO</option></select></div>
<div class="f w12"><label>Unidade de origem (para militar externo)</label><input id="mOrig" placeholder="Preencher quando não pertencer ao cadastro regular do batalhão"></div></div>
<div class="actions"><button id="mSave">Salvar/atualizar</button><button class="secondary" id="mSearch">Pesquisar</button></div></section>
<section id="vtr" class="card hidden"><h2>Cadastro mestre de viaturas</h2><div class="grid">
<div class="f"><label>Prefixo</label><input id="vPref"></div><div class="f"><label>Placa</label><input id="vPlaca"></div><div class="f w6"><label>Marca/modelo</label><input id="vModelo"></div>
<div class="f"><label>Tipo</label><select id="vTipo"><option>Automóvel</option><option>Motocicleta</option><option>Motoneta</option><option>Ciclomotor</option><option>Caminhonete</option><option>Camioneta</option><option>Caminhão</option><option>Ônibus</option><option>Reboque</option><option>Outro</option></select></div><div class="f"><label>Batalhão</label><select id="vBat"><option>BPTran</option><option>BPRv</option></select></div><div class="f"><label>Companhia</label><select id="vCia"></select></div><div class="f"><label>Situação</label><select id="vSit"><option>ATIVA</option><option>INATIVA</option><option>BAIXADA</option></select></div></div>
<div class="actions"><button id="vSave">Salvar/atualizar</button><button class="secondary" id="vSearch">Pesquisar</button></div></section>
<section class="card"><h2>Resultados</h2><div id="results" class="results"><div class="small">Pesquise por matrícula, nome, prefixo ou placa.</div></div></section>
</main>
<script src="central_cloud.js"></script><script>
(function(){
const $=id=>document.getElementById(id),cias=(b)=>[1,2,3,4,5].map(n=>n+'ª '+(b==='BPRv'?'CPRv':'CPTran'));let tab='militar';
function fill(id,b){$(id).innerHTML='<option value="">Não definida</option>'+cias(b).map(x=>'<option>'+x+'</option>').join('')}
fill('mCia','BPTran');fill('vCia','BPTran');$('mBat').onchange=()=>fill('mCia',$('mBat').value);$('vBat').onchange=()=>fill('vCia',$('vBat').value);
$('tabM').onclick=()=>show('militar');$('tabV').onclick=()=>show('viatura');function show(x){tab=x;$('mil').classList.toggle('hidden',x!=='militar');$('vtr').classList.toggle('hidden',x!=='viatura');$('tabM').classList.toggle('active',x==='militar');$('tabV').classList.toggle('active',x==='viatura');$('results').innerHTML=''}
function token(){return CentralCloud.askToken('p3')}async function ensure(){if(!await CentralCloud.probe())throw new Error('Backend v10 ainda não publicado.');const t=token();if(!t)throw new Error('Informe a Chave P3.');return t}
$('mMat').onblur=()=>{$('mMat').value=CentralCloud.formatMatricula($('mMat').value)};
$('mSave').onclick=async()=>{try{const t=await ensure(),mat=CentralCloud.formatMatricula($('mMat').value);if(!/^\d{3}\.\d{3}-\d$/.test(mat))throw new Error('Informe a matrícula no padrão 000.000-0.');
 const p={tipo:'militar',militar:{matricula:mat,postoGrad:$('mPg').value,nome:$('mNome').value,batalhao:$('mBat').value,companhia:$('mCia').value,situacao:$('mSit').value,tipoCadastro:$('mOrig').value?'EXTERNO_VALIDADO':'MANUAL_VALIDADO',unidadeOrigem:$('mOrig').value}};
 const r=await CentralCloud.submitForm('cadastro-upsert',p,t,{popup:false});alert(r.message||'Salvo.')}catch(e){alert(e.message)}};
$('vSave').onclick=async()=>{try{const t=await ensure();if(!$('vPref').value.trim())throw new Error('Informe o prefixo.');
 const p={tipo:'viatura',viatura:{prefixo:$('vPref').value,placa:$('vPlaca').value,marcaModelo:$('vModelo').value,tipo:$('vTipo').value,batalhao:$('vBat').value,companhia:$('vCia').value,situacao:$('vSit').value,origem:'CADASTRO_GESTAO_P3'}};
 const r=await CentralCloud.submitForm('cadastro-upsert',p,t,{popup:false});alert(r.message||'Salvo.')}catch(e){alert(e.message)}};
async function search(tipo,q,u){try{const t=await ensure(),r=await CentralCloud.searchCadastro(tipo,q,u,t),items=r.items||[];$('results').innerHTML=items.length?items.map(x=>'<div class="result"><strong>'+esc(tipo==='militar'?(x.MATRICULA+' — '+x.POSTO_GRAD+' '+x.NOME):(x.PREFIXO+' — '+x.MARCA_MODELO))+'</strong><div class="small">'+esc(x.BATALHAO||'')+' • '+esc(x.COMPANHIA||'')+' • '+esc(x.SITUACAO||'')+(x.PLACA?' • '+esc(x.PLACA):'')+'</div></div>').join(''):'<div class="small">Nenhum resultado.</div>'}catch(e){alert(e.message)}}
$('mSearch').onclick=()=>{const q=prompt('Matrícula ou nome para pesquisar:')||'';search('militar',q,{batalhao:$('mBat').value,companhia:$('mCia').value})};
$('vSearch').onclick=()=>{const q=prompt('Prefixo, placa ou modelo para pesquisar:')||'';search('viatura',q,{batalhao:$('vBat').value,companhia:$('vCia').value})};
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
})();
</script></body></html>
