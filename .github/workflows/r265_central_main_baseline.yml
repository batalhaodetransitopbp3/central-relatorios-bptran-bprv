name: Central Main Baseline - no deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: r265-main-baseline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main-baseline:
    name: main-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without credentials or deploy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run legacy baseline + synthetic fixture + release guard tests
        shell: bash
        run: |
          node --check ci/r265_main_source_change_guard.cjs
          node --test tests/*.test.js tests/r265_main_source_change_guard.test.cjs tests/r265_git_diff_hardening.test.cjs
      - name: Check exact operational release against trusted base and admin activation
        shell: bash
        env:
          R265_TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          R265_APPROVED_RELEASE_DIGEST: ${{ vars.CENTRAL_RELEASE_APPROVED_DIGEST }}
        run: |
          set -euo pipefail
          [[ "$R265_TRUSTED_BASE_SHA" =~ ^[a-f0-9]{40,64}$ ]]
          # Evaluate using the guard committed in the protected base, not the PR.
          git show "${R265_TRUSTED_BASE_SHA}:ci/r265_main_source_change_guard.cjs" > "$RUNNER_TEMP/r265-trusted-guard.cjs"
          node "$RUNNER_TEMP/r265-trusted-guard.cjs"
      - name: Declare CI is not deployment authorization
        shell: bash
        run: |
          echo 'This job does not deploy Apps Script or authorize a production cutover.'
          echo 'R163 historical evidence has not been independently attested.'
