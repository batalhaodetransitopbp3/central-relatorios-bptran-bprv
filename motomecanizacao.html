<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Motomecanização - BPTran/BPRv</title>
<style>
:root{--navy:#17375e;--bg:#eef3f7;--card:#fff;--line:#cbd7e2;--text:#172333;--muted:#66788a;--ok:#176b50;--warn:#9b6713;--danger:#9a2946}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.4 Arial,sans-serif;color:var(--text)}main{max-width:1250px;margin:auto;padding:12px}.head,.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px;box-shadow:0 5px 18px #17375e0d}.head{border-top:5px solid var(--navy)}h1,h2{margin:0 0 8px;color:var(--navy)}.filters,.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:140px}label{display:block;font-size:10px;font-weight:850;text-transform:uppercase;color:#44576b;margin-bottom:3px}input,select,textarea{width:100%;min-height:38px;border:1px solid #b9c7d3;border-radius:9px;padding:7px;background:#fff;font:inherit}textarea{min-height:70px}button,.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none}.secondary{background:#edf2f7;color:#27445f;border:1px solid #c8d4de}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.kpi span{font-size:11px;color:var(--muted);font-weight:800}.kpi strong{display:block;font-size:24px;color:var(--navy);margin-top:3px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;min-width:850px;border-collapse:collapse;background:#fff}th,td{padding:8px;border-bottom:1px solid #dde5eb;text-align:left;vertical-align:top}th{font-size:10px;text-transform:uppercase;background:#f5f8fb;color:#4d6074}.badge{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:850;background:#edf3f8;color:#31516d}.ok{background:#e7f4ed;color:var(--ok)}.warn{background:#fff4df;color:var(--warn)}.danger{background:#fbe9ed;color:var(--danger)}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed #bdcad5;border-radius:10px}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,97vw);background:#fff;border-left:1px solid var(--line);box-shadow:-14px 0 32px #0002;padding:14px;overflow:auto;display:none;z-index:1000}.drawer.open{display:block}.alter{border:1px solid #d6e0e8;border-radius:9px;padding:8px;margin:6px 0;background:#fbfcfd}.small{font-size:11px;color:var(--muted)}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}.field{flex:1 1 45%}}@media(max-width:460px){.field{flex:1 1 100%}}
</style><script>window.CENTRAL_V10_ENABLED=false;</script><script src="central_cloud.js"></script></head><body><main>
<section class="head"><h1>Motomecanização — Gestão de Viaturas</h1><div class="small">Acompanhamento dos checklists das 10 companhias, alterações e providências, sem modificar o checklist original.</div><div class="filters"><div class="field"><label>Companhia</label><select id="cia"><option value="">Todas as 10 companhias</option><option>1ª CPTran</option><option>2ª CPTran</option><option>3ª CPTran</option><option>4ª CPTran</option><option>5ª CPTran</option><option>1ª CPRv</option><option>2ª CPRv</option><option>3ª CPRv</option><option>4ª CPRv</option><option>5ª CPRv</option></select></div><div class="field"><label>Prefixo/placa</label><input id="q" placeholder="Pesquisar viatura"></div><div class="field"><label>Situação</label><select id="st"><option value="">Todas</option><option value="COM_ALTERACAO">Com alteração</option><option value="SEM_ALTERACAO">Sem alteração</option><option value="PENDENTE">Pendência aberta</option></select></div><button onclick="refresh()">Atualizar</button><a class="btn secondary" href="index.html">Voltar</a></div></section>
<section class="cards"><div class="kpi"><span>Viaturas com checklist</span><strong id="kVtr">0</strong></div><div class="kpi"><span>Checklists no período</span><strong id="kChk">0</strong></div><div class="kpi"><span>Com alteração</span><strong id="kAlt">0</strong></div><div class="kpi"><span>Pendências abertas</span><strong id="kPend">0</strong></div></section>
<section class="card"><h2>Últimos checklists por viatura</h2><div id="table"></div></section>
</main><aside id="drawer" class="drawer"><button class="secondary" onclick="closeDrawer()">Fechar</button><div id="detail"></div></aside>
<script>
const $=id=>document.getElementById(id);let rows=[],maint=[];function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function nChk(x){return{checklistId:x.CHECKLIST_ID||x.checklistId||x.id,companhia:x.COMPANHIA||x.unidade?.companhia||'',batalhao:x.BATALHAO||x.unidade?.batalhao||'',prefixo:x.PREFIXO||x.prefixo||'',placa:x.PLACA||x.placa||'',marcaModelo:x.MARCA_MODELO||x.marcaModelo||'',data:x.DATA||x.data||'',hora:x.HORA||x.hora||'',condutor:x.CONDUTOR||x.condutor||'',matricula:x.MATRICULA||x.matricula||'',status:x.STATUS||x.status||((x.alteracoes||[]).length?'COM_ALTERACAO':'SEM_ALTERACAO'),alteracoes:Array.isArray(x.alteracoes)?x.alteracoes:parseJson(x.ALTERACOES_JSON),fotoCount:Number(x.FOTO_COUNT||x.fotoCount||0),fotos:Array.isArray(x.fotos)?x.fotos:parseJson(x.FOTOS_JSON)}}
function parseJson(v){try{return JSON.parse(v||'[]')}catch(_){return []}}
function nMaint(x){return{id:x.MANUTENCAO_ID||x.manutencaoId||x.id,checklistId:x.CHECKLIST_ID||x.checklistId,prefixo:x.PREFIXO||x.prefixo||'',item:x.ITEM||x.item||'',descricao:x.DESCRICAO||x.descricao||'',status:x.STATUS||x.status||'EM_ANALISE',providencia:x.PROVIDENCIA||x.providencia||'',updatedAt:x.UPDATED_AT||x.updatedAt||''}}
async function cloudLoad(){if(!CentralCloud?.isEnabled())return false;const token=CentralCloud.getToken('central')||CentralCloud.askToken('central');if(!token)return false;try{const [a,b]=await Promise.all([CentralCloud.jsonp('checklist-list',{token}),CentralCloud.jsonp('manutencao-list',{token})]);rows=(a.items||[]).map(nChk);maint=(b.items||[]).map(nMaint);return true}catch(_){return false}}
function localLoad(){rows=(CentralCloud.listLocal('checklists')||[]).map(nChk);maint=(CentralCloud.listLocal('manutencoes')||[]).map(nMaint)}
function pendFor(c){return maint.filter(m=>m.checklistId===c.checklistId&&!['SOLUCIONADO','ENCERRADO'].includes(String(m.status).toUpperCase()))}
function filtered(){let x=rows.slice(),c=$('cia').value,q=$('q').value.trim().toLowerCase(),s=$('st').value;if(c)x=x.filter(r=>r.companhia===c);if(q)x=x.filter(r=>(r.prefixo+' '+r.placa+' '+r.marcaModelo).toLowerCase().includes(q));if(s==='PENDENTE')x=x.filter(r=>pendFor(r).length);else if(s)x=x.filter(r=>r.status===s);return x.sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora))}
function latestByVtr(list){const map=new Map();for(const r of list){const k=(r.prefixo||r.placa||r.checklistId).toUpperCase();if(!map.has(k))map.set(k,r)}return [...map.values()]}
function render(){const all=filtered(),latest=latestByVtr(all);$('kVtr').textContent=latest.length;$('kChk').textContent=all.length;$('kAlt').textContent=all.filter(x=>x.status==='COM_ALTERACAO').length;$('kPend').textContent=maint.filter(x=>!['SOLUCIONADO','ENCERRADO'].includes(String(x.status).toUpperCase())).length;$('table').innerHTML=latest.length?'<div class="table-wrap"><table><thead><tr><th>Prefixo</th><th>Companhia</th><th>Último checklist</th><th>Situação</th><th>Alterações</th><th>Pendências</th><th></th></tr></thead><tbody>'+latest.map(r=>'<tr><td><strong>'+esc(r.prefixo||'—')+'</strong><br><small>'+esc(r.placa)+'</small></td><td>'+esc(r.companhia)+'</td><td>'+esc(r.data+' '+r.hora)+'<br><small>'+esc(r.condutor)+' '+esc(r.matricula)+'</small></td><td><span class="badge '+(r.status==='COM_ALTERACAO'?'warn':'ok')+'">'+esc(r.status)+'</span></td><td>'+r.alteracoes.length+'</td><td>'+pendFor(r).length+'</td><td><button class="secondary" onclick="openDetail(\''+esc(r.checklistId)+'\')">Abrir</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Nenhum checklist localizado.</div>'}
function openDetail(id){const r=rows.find(x=>x.checklistId===id);if(!r)return;const p=pendFor(r);$('detail').innerHTML='<h2>VTR '+esc(r.prefixo)+'</h2><p>'+esc(r.marcaModelo)+' — '+esc(r.placa)+'<br>'+esc(r.companhia)+' — '+esc(r.data+' '+r.hora)+'</p><h3>Alterações registradas</h3>'+(r.alteracoes.length?r.alteracoes.map((a,i)=>{const existing=maint.find(m=>m.checklistId===r.checklistId&&m.item===(a.item||String(i)));return '<div class="alter"><strong>'+esc(a.label||a.item||'Alteração')+'</strong><br>'+esc(a.status||'')+' '+esc(a.detalhe||'')+'<div class="actions"><select id="ms'+i+'"><option>EM_ANALISE</option><option>EM_MANUTENCAO</option><option>SOLUCIONADO</option><option>ENCERRADO</option></select><input id="mp'+i+'" placeholder="Providência adotada" value="'+esc(existing?.providencia||'')+'"><button onclick="saveMaint(\''+esc(r.checklistId)+'\',\''+esc(a.item||String(i))+'\','+i+')">Salvar</button></div></div>'}).join(''):'<div class="empty">Sem alterações.</div>')+'<h3>Histórico de providências</h3>'+(maint.filter(m=>m.checklistId===r.checklistId).map(m=>'<div class="alter"><span class="badge">'+esc(m.status)+'</span> '+esc(m.item)+'<br>'+esc(m.providencia||'')+'<br><small>'+esc(m.updatedAt||'')+'</small></div>').join('')||'<p class="small">Sem providências registradas.</p>');$('drawer').classList.add('open');r.alteracoes.forEach((a,i)=>{const ex=maint.find(m=>m.checklistId===r.checklistId&&m.item===(a.item||String(i)));if(ex&&$('ms'+i))$('ms'+i).value=ex.status})}
function closeDrawer(){$('drawer').classList.remove('open')}
async function saveMaint(checklistId,item,i){const r=rows.find(x=>x.checklistId===checklistId),a=r?.alteracoes?.find((x,j)=>(x.item||String(j))===item);if(!r||!a)return;const id='mnt-'+checklistId+'-'+item,rec={manutencaoId:id,id,checklistId,prefixo:r.prefixo,placa:r.placa,companhia:r.companhia,item,descricao:(a.label||item)+' '+(a.detalhe||''),status:$('ms'+i).value,providencia:$('mp'+i).value.trim(),updatedAt:new Date().toISOString()};CentralCloud.upsertLocal('manutencoes',rec,'manutencaoId');const idx=maint.findIndex(x=>x.id===id);if(idx>=0)maint[idx]=rec;else maint.push(rec);if(CentralCloud.isEnabled()){const token=CentralCloud.getToken('central')||CentralCloud.askToken('central');if(token)try{await CentralCloud.postOrQueue('manutencao-upsert',{manutencao:rec},{token,popup:false})}catch(_){}}openDetail(checklistId);render()}
async function refresh(){if(!(await cloudLoad()))localLoad();render()}$('cia').onchange=render;$('q').oninput=render;$('st').onchange=render;document.addEventListener('DOMContentLoaded',()=>setTimeout(refresh,250));
</script></body></html>
