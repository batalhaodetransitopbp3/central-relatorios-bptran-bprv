<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Transporte CIRVC - BPTran/BPRv</title>
<style>:root{--navy:#17375e;--bg:#eef3f7;--line:#cbd7e2;--ok:#176b50;--danger:#9c2846;--text:#172333;--muted:#657487}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.4 Arial,sans-serif;color:var(--text)}main{max-width:1100px;margin:auto;padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px;box-shadow:0 5px 18px #17375e12}.head{border-top:5px solid var(--navy)}h1,h2{margin:0 0 8px;color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px}.f{grid-column:span 3}.span6{grid-column:span 6}.span12{grid-column:1/-1}label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;color:#43566c;margin-bottom:3px}input,select,textarea{width:100%;min-height:38px;border:1px solid #b8c7d4;border-radius:9px;padding:7px;background:#fff;font:inherit}textarea{min-height:70px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.btn,button{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none}.secondary{background:#edf2f7;color:#23405d;border:1px solid #c7d3dd}.ok{background:var(--ok)}.status{font-size:12px;color:var(--muted)}.vehicle{display:grid;grid-template-columns:32px 1.2fr 1fr 1.3fr 1.1fr;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px;margin:7px 0;background:#fbfcfd}.vehicle small{display:block;color:var(--muted)}.badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800;background:#eef3f8;color:#33516d}.badge.ok{background:#e6f5ee;color:#176b50}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed #bdcad5;border-radius:10px}.sign{border:1px dashed #9fafbd;border-radius:10px;height:140px;background:#fff}.sign canvas{width:100%;height:100%;touch-action:none}.hint{font-size:11px;color:var(--muted)}@media(max-width:720px){.f,.span6{grid-column:1/-1}.vehicle{grid-template-columns:28px 1fr}.vehicle>div{grid-column:2}.vehicle>input{grid-row:1/5}.toolbar .btn,.toolbar button{flex:1 1 44%}}@media print{.no-print{display:none!important}body{background:#fff}.card{box-shadow:none;border-color:#777}.vehicle input{display:none}.vehicle{grid-template-columns:1fr 1fr 1fr 1fr}.head{border-top:0}}</style>
<script>window.CENTRAL_V10_ENABLED=false;</script><script src="central_cloud.js"></script></head><body><main>
<section class="card head"><h1>Transporte / Entrega CIRVC</h1><div class="status">Continuidade da custódia dos veículos removidos até a entrega ao destinatário final.</div></section>
<section class="card no-print"><div class="grid"><div class="f"><label>Batalhão</label><select id="bat"><option>BPTran</option><option>BPRv</option></select></div><div class="f"><label>Companhia</label><select id="cia"></select></div><div class="f"><label>Data do transporte</label><input id="data" type="date"></div><div class="f"><label>Destino final</label><input id="destino" value="DETRAN-PB"></div><div class="span6"><label>Responsável pelo transporte</label><input id="resp" placeholder="Posto/graduação e nome"></div><div class="f"><label>Matrícula</label><input id="mat" inputmode="numeric" placeholder="000.000-0"></div><div class="f"><label>VTR/Reboque</label><input id="vtr" placeholder="Prefixo"></div></div><div class="toolbar"><button class="secondary" onclick="loadPending()">Atualizar veículos pendentes</button><button class="ok" onclick="finalizeTransport()">Gerar termo e dar baixa</button><a class="btn secondary" href="index.html">Voltar à Central</a></div></section>
<section class="card"><h2>Veículos aguardando transporte</h2><div id="list"></div></section>
<section class="card"><h2>Recebimento no destino final</h2><div class="grid"><div class="span6"><label>Nome de quem recebeu</label><input id="recebedor"></div><div class="f"><label>Matrícula/identificação</label><input id="recebedorId"></div><div class="f"><label>Data/hora</label><input id="entregaEm" type="datetime-local"></div><div class="span12"><label>Observações</label><textarea id="obs"></textarea></div><div class="span6"><label>Assinatura do responsável pelo transporte</label><div class="sign"><canvas id="sigTrans"></canvas></div><button class="secondary no-print" onclick="clearSig('sigTrans')">Limpar assinatura</button></div><div class="span6"><label>Assinatura do recebedor</label><div class="sign"><canvas id="sigRec"></canvas></div><button class="secondary no-print" onclick="clearSig('sigRec')">Limpar assinatura</button></div></div></section>
<section class="card" id="term" hidden><h2>Termo de entrega de veículos</h2><div id="termBody"></div></section>
</main><script>
const $=id=>document.getElementById(id);let pending=[];let selected=new Set();
function localDate(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}$('data').value=localDate();$('entregaEm').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
function fillCias(){const b=$('bat').value==='BPRv'?'CPRv':'CPTran';$('cia').innerHTML=[1,2,3,4,5].map(n=>'<option value="'+n+'">'+n+'ª '+b+'</option>').join('')}fillCias();$('bat').onchange=fillCias;
function unit(){return{batalhao:$('bat').value,companhiaNumero:Number($('cia').value),companhia:$('cia').selectedOptions[0]?.text||''}}function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function normalize(x){return{cirvcId:x.CIRVC_ID||x.cirvcId||x.id,placa:x.PLACA||x.placa||x.placaUf||'',marcaModelo:x.MARCA_MODELO||x.marcaModelo||'',tipo:x.TIPO||x.tipo||'',localCustodia:x.LOCAL_CUSTODIA||x.localCustodia||x.local||'',data:x.DATA||x.data||'',responsavel:x.RESPONSAVEL_CIRVC||x.responsavelCirvc||'',status:x.STATUS_CUSTODIA||x.statusCustodia||'AGUARDANDO_TRANSPORTE'}}function localPending(){return(CentralCloud?.listLocal('cirvc')||[]).map(normalize).filter(x=>!['ENTREGUE_DETRAN','BAIXADO','ENTREGUE'].includes(String(x.status).toUpperCase()))}
async function loadPending(){selected.clear();pending=[];const token=CentralCloud?.getToken('central');if(CentralCloud?.isEnabled()&&token){try{const r=await CentralCloud.jsonp('cirvc-pendentes',{...CentralCloud.unitParams(unit()),token});pending=(r.items||[]).map(normalize)}catch(e){pending=localPending();alert('Consulta em nuvem indisponível; exibindo registros preservados neste aparelho.')}}else pending=localPending();render()}
function render(){const box=$('list');if(!pending.length){box.innerHTML='<div class="empty">Nenhum veículo pendente localizado para esta unidade.</div>';return}box.innerHTML=pending.map(x=>'<label class="vehicle"><input type="checkbox" data-id="'+esc(x.cirvcId)+'"><div><strong>'+esc(x.placa||'Sem placa')+'</strong><small>'+esc(x.marcaModelo||x.tipo||'—')+'</small></div><div><span class="badge">'+esc(x.data||'—')+'</span><small>'+esc(x.responsavel||'')+'</small></div><div><strong>'+esc(x.localCustodia||'Local não informado')+'</strong><small>Custódia atual</small></div><div><span class="badge ok">Aguardando transporte</span></div></label>').join('');box.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>c.checked?selected.add(c.dataset.id):selected.delete(c.dataset.id))}
function fmtMat(v){return CentralCloud?.formatMatricula(v)||v}$('mat').oninput=e=>e.target.value=fmtMat(e.target.value);
function setupCanvas(id){const c=$(id),ctx=c.getContext('2d');function resize(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=2;ctx.lineCap='round'}resize();let on=false,last=null;const p=e=>{const r=c.getBoundingClientRect(),q=e;return{x:q.clientX-r.left,y:q.clientY-r.top}};c.addEventListener('pointerdown',e=>{on=true;last=p(e);e.preventDefault()});c.addEventListener('pointermove',e=>{if(!on)return;const q=p(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();last=q;e.preventDefault()});window.addEventListener('pointerup',()=>on=false)}setupCanvas('sigTrans');setupCanvas('sigRec');function clearSig(id){const c=$(id);c.getContext('2d').clearRect(0,0,c.width,c.height)}
function selectedRows(){return pending.filter(x=>selected.has(String(x.cirvcId)))}
async function finalizeTransport(){const rows=selectedRows();if(!rows.length){alert('Marque ao menos um veículo.');return}if(!$('resp').value.trim()||!$('mat').value.trim()||!$('recebedor').value.trim()){alert('Informe o responsável pelo transporte, matrícula e quem recebeu no destino.');return}const transporte={transporteId:CentralCloud.uid('transporte'),unidade:unit(),data:$('data').value,destino:$('destino').value.trim(),responsavel:{nome:$('resp').value.trim(),matricula:fmtMat($('mat').value)},vtr:$('vtr').value.trim().toUpperCase(),recebedor:{nome:$('recebedor').value.trim(),identificacao:$('recebedorId').value.trim()},entregaEm:$('entregaEm').value,observacoes:$('obs').value.trim(),cirvcIds:rows.map(x=>x.cirvcId),veiculos:rows,status:'ENTREGUE_DETRAN',assinaturas:{transportador:$('sigTrans').toDataURL('image/png'),recebedor:$('sigRec').toDataURL('image/png')}};rows.forEach(x=>{const old=(CentralCloud.listLocal('cirvc')||[]).find(y=>String(y.cirvcId||y.id)===String(x.cirvcId))||{};CentralCloud.upsertLocal('cirvc',{...old,statusCustodia:'ENTREGUE_DETRAN',transporteId:transporte.transporteId,entregaEm:transporte.entregaEm},'cirvcId')});CentralCloud.upsertLocal('transportesCirvc',transporte,'transporteId');let msg='';if(CentralCloud.isEnabled()){const token=CentralCloud.getToken('central')||CentralCloud.askToken('central');if(token){try{const r=await CentralCloud.postOrQueue('cirvc-entrega-final',{transporte},{token,unit:unit(),popup:false});msg=r.queued?' Envio pendente de sincronização.':' Baixa sincronizada.'}catch(e){msg=' Baixa preservada localmente.'}}}buildTerm(transporte);alert('Veículos baixados do controle interno.'+msg);pending=pending.filter(x=>!selected.has(String(x.cirvcId)));selected.clear();render()}
function buildTerm(t){$('term').hidden=false;$('termBody').innerHTML='<p><strong>'+esc(t.unidade.companhia)+'</strong> — '+esc(t.data)+' — Destino: '+esc(t.destino)+'</p><p>Responsável pelo transporte: <strong>'+esc(t.responsavel.nome)+'</strong> — '+esc(t.responsavel.matricula)+' — VTR/Reboque: '+esc(t.vtr||'—')+'</p><table style="width:100%;border-collapse:collapse"><thead><tr><th style="border:1px solid #777">Placa</th><th style="border:1px solid #777">Veículo</th><th style="border:1px solid #777">CIRVC</th></tr></thead><tbody>'+t.veiculos.map(x=>'<tr><td style="border:1px solid #777;padding:5px">'+esc(x.placa)+'</td><td style="border:1px solid #777;padding:5px">'+esc(x.marcaModelo||x.tipo)+'</td><td style="border:1px solid #777;padding:5px">'+esc(x.cirvcId)+'</td></tr>').join('')+'</tbody></table><p>Recebido por: <strong>'+esc(t.recebedor.nome)+'</strong> — '+esc(t.recebedor.identificacao||'')+' — '+esc(t.entregaEm)+'</p><p>'+esc(t.observacoes||'')+'</p><div class="toolbar no-print"><button onclick="window.print()">Imprimir / Salvar PDF</button></div>';window.scrollTo({top:$('term').offsetTop,behavior:'smooth'})}
document.addEventListener('DOMContentLoaded',()=>setTimeout(loadPending,250));
</script></body></html>
